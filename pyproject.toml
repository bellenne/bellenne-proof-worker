[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bellenne-proof-worker"
version = "0.1.0"
description = "Recoverable RGB proof production executor for BellenneProof Core"
requires-python = ">=3.12"
dependencies = [
  "pyvips>=2.2.3,<4", "opencv-contrib-python-headless>=4.10,<5",
  "numpy>=2,<3", "httpx>=0.27,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "structlog>=24.4,<27",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "Pillow>=11,<13", "ruff>=0.11,<1"]
windows = ["pyvips-binary>=8.16,<9"]

[project.scripts]
proof-worker = "app.main:main"
proof-process = "app.cli.process:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["large: large TIFF streaming smoke test"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
